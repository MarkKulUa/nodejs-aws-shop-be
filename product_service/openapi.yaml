openapi: 3.0.3
info:
  title: Product Service API
  description: API for managing Porsche Cayenne accessories catalog backed by DynamoDB
  version: 2.0.0

servers:
  - url: https://<api-id>.execute-api.eu-west-1.amazonaws.com/prod
    description: Production

paths:
  /products:
    get:
      summary: Get all products
      description: Returns a list of products joined with their stock counts
      operationId: getProductsList
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableProduct"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create a new product
      description: Creates a product and its stock entry transactionally
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableProduct"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /products/{productId}:
    get:
      summary: Get product by ID
      description: Returns a single product joined with its stock
      operationId: getProductsById
      parameters:
        - name: productId
          in: path
          required: true
          description: The ID of the product to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableProduct"
        "400":
          description: Product ID is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    AvailableProduct:
      type: object
      required:
        - id
        - title
        - description
        - price
        - count
      properties:
        id:
          type: string
          format: uuid
          example: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
        title:
          type: string
          example: "Porsche Cayenne All-Weather Floor Mats"
        description:
          type: string
          example: "Heavy-duty rubber floor mats ..."
        price:
          type: number
          format: float
          example: 150
        count:
          type: integer
          example: 12

    CreateProductRequest:
      type: object
      required:
        - title
        - price
        - count
      properties:
        title:
          type: string
          example: "New Product"
        description:
          type: string
          example: "Optional description"
        price:
          type: number
          format: float
          minimum: 0
          example: 199
        count:
          type: integer
          minimum: 0
          example: 10

    Error:
      type: object
      properties:
        message:
          type: string
          example: "Product not found"
